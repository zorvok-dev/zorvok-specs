name: Publish

# The public registry's stand-in for trunk.cocoapods.org (zorvok ADR 0010).
# `zorvok trunk push` opens a pull request from the publisher's fork that
# adds Specs/<name>/<version>/<name>.podspec.json, plus Specs/<name>/OWNERS
# for a brand-new pod. This workflow is the only thing with write access to
# this repository, and it decides, with no human in the loop, whether the
# pull request is published or rejected:
#
#   1. scripts/validate-pr.sh: immutability, structure and ownership.
#   2. scripts/publish-policy.sh: what else trunk would check, including,
#      for a name that already exists on CocoaPods trunk, that the
#      publisher is one of its owners there (scripts/verify-trunk-owner.sh).
#
# Both judge the pull request as it would land on the registry's CURRENT
# tip: the workflow merges it onto the tip itself (git merge-tree, without
# touching the working tree), commits the resulting files with the tip as
# the only parent, checks that commit against the tip, and publishes it by
# pushing it as a fast-forward. The commit the pull request happens to be
# based on is never what gets checked, because its author chooses it (an
# older base would otherwise let a removed owner publish), and none of the
# pull request's own commits enter the registry's history: only the files
# that were checked do. If main moves while a run is checking, the
# fast-forward push fails and the checks run again on the new tip. A push
# made with this workflow's token doesn't trigger regenerate-index.yml, so
# the index files are regenerated in the same job. Every run ends with a
# comment whose first line is a machine-readable verdict on the exact
# commit it judged, which `zorvok trunk push` waits for, and then closes
# the pull request, published or not.
#
# Security: pull_request_target runs with this repository's write token, so
# nothing from the pull request may ever run. The job checks out the base
# branch, copies its scripts aside before touching anything else, fetches
# the pull request's commits as data only, and runs only those copies, which
# only read files out of git (git show / git diff / jq) and fetch public
# data from CocoaPods trunk and GitHub. Nothing from the pull request is
# interpolated into a script: every value reaches the shell through env,
# and the verdict comment quotes details as a code block with control
# characters (carriage returns included) removed. Only the pull request's
# author may update it: a push by anyone else is judged as theirs, so it's
# rejected. The checkout action is pinned to a commit.
#
# NOTE: like regenerate-index.yml, this YAML hasn't run on real GitHub
# Actions yet; the scripts it calls are tested locally
# (scripts/test-validate-pr.sh, scripts/test-publish-policy.sh), and
# scripts/test-publish-workflow.sh runs this job's script on simulated pull
# requests. Watch the first real publish's run.

on:
  # pull_request_target is what gives a fork's pull request a token that
  # can publish, and it's safe here only because nothing from the pull
  # request ever runs (see Security above).
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "Specs/**"

# Nothing by default; the one job asks for exactly what it uses.
permissions: {}

# One run per pull request at a time; a newer push to it replaces a run
# still in progress. Different pull requests run side by side: each
# publishes by fast-forward, so the one that loses a race checks again,
# and push-index.sh retries the same way.
concurrency:
  group: publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Judge and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the published entry and the index to main
      pull-requests: write # to comment the verdict, then close the pull request
      actions: write # to start regenerate-index.yml if this job can't push the index
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      AUTHOR_ID: ${{ github.event.pull_request.user.id }}
      SENDER_ID: ${{ github.event.sender.id }} # who opened, pushed to or reopened it
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          # The job pushes with this token. The same token is in GH_TOKEN
          # for gh anyway, and the job uploads no artifacts.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Judge, then publish or explain
        id: judge
        run: |
          tools="$RUNNER_TEMP/registry-scripts"
          mkdir -p "$tools"
          cp scripts/validate-pr.sh scripts/publish-policy.sh scripts/verify-trunk-owner.sh \
             scripts/generate-index.sh scripts/push-index.sh "$tools/"
          chmod +x "$tools"/*.sh

          git fetch -q --no-tags origin "pull/$PR/head:refs/remotes/pr/head"
          if [ "$(git rev-parse refs/remotes/pr/head)" != "$HEAD_SHA" ]; then
            echo "A newer commit has been pushed to this pull request; its own run judges it."
            exit 0
          fi

          verdict=""
          details=""
          if [ "$SENDER_ID" != "$AUTHOR_ID" ]; then
            # Everything below is judged as the author's; a push or reopen
            # by someone else (a collaborator on the fork, say) isn't theirs.
            verdict=rejected
            details="Only the pull request's author can update it, and someone else just did. Run zorvok trunk push again to open a fresh one."
          fi
          for attempt in 1 2 3 4 5; do
            [ -n "$verdict" ] && break
            git fetch -q --no-tags origin "$BASE"
            tip="$(git rev-parse "origin/$BASE")"
            if ! tree="$(git merge-tree --write-tree "$tip" "$HEAD_SHA" 2>/dev/null)"; then
              verdict=rejected
              details="It conflicts with what's already in the registry. Run zorvok trunk push again to rebuild it on the latest registry."
              break
            fi
            # The tip is the only parent: the pull request's own commits,
            # and anything hidden in their history, never become part of
            # the registry; only the files checked below do.
            merged="$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit-tree "$tree" -p "$tip" -m "Publish #$PR by @$AUTHOR (GitHub user $AUTHOR_ID)")"
            if ! out="$("$tools/validate-pr.sh" "$tip" "$merged" "$AUTHOR_ID" 2>&1)"; then
              verdict=rejected
              details="$out"
              break
            fi
            if ! out="$("$tools/publish-policy.sh" "$tip" "$merged" "$AUTHOR_ID" "$AUTHOR" 2>&1)"; then
              verdict=rejected
              details="$out"
              break
            fi
            # A plain push only succeeds as a fast-forward from $tip, so
            # exactly the commit just checked is what gets published.
            if git push -q origin "$merged:refs/heads/$BASE"; then
              verdict=published
              break
            fi
            sleep $((attempt * 3)) # main moved: check again on its new tip
          done
          if [ -z "$verdict" ]; then
            verdict=rejected
            details="The registry was busy publishing other pods. Run zorvok trunk push again."
          fi

          note="It can take up to 5 minutes to show up everywhere."
          if [ "$verdict" = published ] && ! "$tools/push-index.sh" "$BASE" "$GITHUB_WORKSPACE"; then
            # The index push kept losing races or failing: hand it to
            # regenerate-index.yml (a workflow_dispatch from this token does
            # start a run), which rebuilds from main.
            gh workflow run regenerate-index.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE"
            note="The index is still being rebuilt, so it can take up to 10 minutes to show up everywhere."
          fi

          {
            printf '<!-- zorvok-publish sha=%s verdict=%s -->\n' "$HEAD_SHA" "$verdict"
            if [ "$verdict" = published ]; then
              printf 'Published. %s\n' "$note"
            else
              # Quoted as an indented code block, so nothing from the pull
              # request or from CocoaPods trunk renders as links or mentions.
              printf "This can't be published:\n\n"
              printf '%s\n' "$details" | tr -d '\000-\010\013-\037\177' | sed 's/^/    /'
            fi
          } > "$RUNNER_TEMP/verdict.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/verdict.md"
          # Its files are in main now (published), or nobody would ever
          # merge it (rejected); either way it's done. `zorvok trunk push`
          # opens a fresh one on the next attempt.
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" || true
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Report an unexpected failure
        if: failure()
        run: |
          printf '<!-- zorvok-publish sha=%s verdict=rejected -->\nSomething went wrong on the registry'"'"'s side while checking this (%s). Run zorvok trunk push again to retry.\n' \
            "$HEAD_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/verdict.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/verdict.md"

      # A rejected pull request shows a failed check, so it stands out in
      # the list; its comment above already says why.
      - name: Fail the check if rejected
        if: steps.judge.outputs.verdict == 'rejected'
        run: exit 1
