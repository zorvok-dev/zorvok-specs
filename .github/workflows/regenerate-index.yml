name: Regenerate index

# Rebuilds all_pods.txt / all_pods_versions.txt from the Specs/ tree after
# a maintainer merges into main, and commits the result if it changed — the
# static equivalent of zorvok-registry/cdn computing the same files from
# the live store on every request (zorvok ADR 0006/0009). Pull requests the
# publish workflow merges itself get their index regenerated there instead,
# since a merge made with a workflow's token doesn't trigger this one. Both
# use scripts/push-index.sh, which retries if they race. Run it by hand
# (Actions → Regenerate index → Run workflow) to repair a stale index.
#
# NOTE: like publish.yml, this workflow's YAML wiring is untested against
# real GitHub Actions; the scripts it calls are tested locally.

on:
  push:
    branches: [main]
    paths:
      - "Specs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-index
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and push the index files
        run: |
          chmod +x scripts/push-index.sh scripts/generate-index.sh
          scripts/push-index.sh main "$GITHUB_WORKSPACE"
